    owner: conversation

  # task-groups：由 architecture:adopt 登记
  - id: task-groups
    roots:
      - packages/services/src/task-groups
    managed: true
    requires:
      - services
      - session
      - shared
    publicEntrypoints:
      - packages/services/src/task-groups/index.ts
      - packages/services/src/task-groups/contract.ts
