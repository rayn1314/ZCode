      - ui
  # web-remote-control：由 architecture:adopt 登记
  - id: web-remote-control
    roots:
      - packages/web/src/web-remote-control
    managed: true
    requires:
      - client
      - mobile-ui
      - shared
      - ui
      - web
      - web-remote-relay
    publicEntrypoints:
      - packages/web/src/web-remote-control/index.ts
      - packages/web/src/web-remote-control/contract.ts
      - packages/web/src/web-remote-control/views.ts
      - packages/web/src/web-remote-control/adapters/webRemoteControlThemeSeed.ts
