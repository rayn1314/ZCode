  # mobile-ui：由 architecture:adopt 登记
  - id: mobile-ui
    roots:
      - packages/ui/src/components/mobile-ui
    managed: true
    requires:
      - ui
    publicEntrypoints:
      - packages/ui/src/components/mobile-ui/index.ts
      - packages/ui/src/components/mobile-ui/contract.ts
